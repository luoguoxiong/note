<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物流智能理赔审核台 · Multi-Agent</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171d24; --panel2: #1e262f; --border: #2a3440;
    --text: #e6edf3; --dim: #8b98a5; --accent: #3fb950; --warn: #d29922; --danger: #f85149; --info: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  .left { width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .left .toolbar { padding: 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  select, input, textarea { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  button { background: #238636; border: none; color: #fff; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.gray { background: #30363d; } button.red { background: #b62324; } button.blue { background: #1f6feb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .cases { flex: 1; overflow-y: auto; }
  .case-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .case-item:hover { background: var(--panel2); }
  .case-item.active { background: var(--panel2); border-left: 3px solid var(--info); }
  .case-item .no { font-weight: 600; font-size: 13px; }
  .case-item .meta { color: var(--dim); font-size: 12px; margin-top: 3px; display: flex; justify-content: space-between; }
  .right { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .b-submitted { background: #30363d; } .b-running { background: #1f3a5f; color: var(--info); }
  .b-waiting_approval { background: #3d2e00; color: var(--warn); } .b-completed { background: #12351c; color: var(--accent); }
  .b-failed, .b-rejected { background: #3d1214; color: var(--danger); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; }
  .kv .k { color: var(--dim); }
  .log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.7; color: var(--dim); max-height: 220px; overflow-y: auto; }
  .log .ok { color: var(--accent); } .log .err { color: var(--danger); } .log .info { color: var(--info); } .log .warn { color: var(--warn); }
  .approval-box { border: 1px solid var(--warn); }
  .risk-high { color: var(--danger); font-weight: 600; } .risk-medium { color: var(--warn); font-weight: 600; } .risk-low { color: var(--accent); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .hidden { display: none; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }
  .pill { font-size: 11px; border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; color: var(--dim); }
  .pill.pass { color: var(--accent); border-color: var(--accent); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .pill.block { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>物流智能理赔审核台</h1>
  <span class="sub">LangGraph Multi-Agent · Supervisor 编排 · interrupt 人工审批 · MCP 工具</span>
</header>
<main>
  <section class="left">
    <div class="toolbar">
      <select id="tpl" style="flex:1"></select>
      <button id="submitBtn">提交案件</button>
    </div>
    <div class="cases" id="cases"><div class="empty">加载中...</div></div>
  </section>
  <section class="right">
    <div class="empty" id="placeholder">← 提交或选择一个案件</div>
    <div id="detail" class="hidden">
      <div class="card">
        <h3>案件</h3>
        <div class="kv" id="caseKv"></div>
      </div>
      <div class="card approval-box hidden" id="approvalCard">
        <h3>人工审批请求（interrupt 挂起中）</h3>
        <div class="kv" id="approvalKv"></div>
        <div class="row">
          <input id="approver" placeholder="审批人" value="王经理" style="width:110px">
          <input id="comment" placeholder="审批意见" style="flex:1">
          <button id="approveBtn">通过</button>
          <button class="red" id="rejectBtn">拒绝</button>
        </div>
      </div>
      <div class="card">
        <h3>执行轨迹（Agent 链路追踪）</h3>
        <div class="log" id="traceLog"></div>
      </div>
      <div class="card hidden" id="reportCard">
        <h3>审核报告</h3>
        <div class="kv" id="reportKv"></div>
        <div id="reportBasis" style="margin-top:10px;font-size:13px;line-height:1.8"></div>
        <div id="ruleHits" style="margin-top:10px;font-size:12px;line-height:1.8"></div>
      </div>
      <div class="card hidden" id="decisionCard">
        <h3>最终决策（高影响操作，与 Agent 流程隔离）</h3>
        <div class="row">
          <input id="decToken" placeholder="审批令牌" value="demo-approver-token" style="width:180px">
          <button class="blue" id="payBtn">赔付</button>
          <button class="red" id="rejectPayBtn">拒赔</button>
          <span id="decisionInfo" style="font-size:12px;color:var(--dim)"></span>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let currentCase = null;
let unsubscribe = null;
let templates = [];

const STATUS_LABEL = { submitted:'已受理', planning:'编排中', parsing:'材料解析中', verifying:'多源核验中', rule_checking:'规则审核中', risk_assessing:'风险评估中', waiting_approval:'等待人工审批', reporting:'报告生成中', completed:'审核完成', rejected:'已拒绝', failed:'失败' };
const AGENT_LABEL = { supervisor:'Supervisor', parse:'材料解析', waybill:'运单核验', history:'历史核验', rules:'规则审核', risk:'风险评估', approval:'人工审批', report:'报告生成', human:'人工操作' };

async function api(method, path, body, headers) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(headers||{}) }, body: body ? JSON.stringify(body) : undefined });
  return { status: r.status, json: await r.json().catch(() => ({})) };
}

async function loadTemplates() {
  templates = (await api('GET', '/api/templates')).json;
  $('#tpl').innerHTML = templates.map(t => `<option value="${t.key}">${t.title}（预期：${t.expect}）</option>`).join('');
}

async function loadCases() {
  const cases = (await api('GET', '/api/cases')).json;
  $('#cases').innerHTML = cases.length ? cases.map(c => `
    <div class="case-item ${currentCase === c.id ? 'active' : ''}" data-id="${c.id}">
      <div class="no">${c.caseNo}</div>
      <div class="meta"><span>${c.claimantName} · ${c.declaredAmount}元 · ${c.caseType}</span>
      <span class="badge b-${c.status}${['planning','parsing','verifying','rule_checking','risk_assessing','reporting'].includes(c.status) ? ' b-running' : ''}">${STATUS_LABEL[c.status] || c.status}${c.running ? '…' : ''}</span></div>
    </div>`).join('') : '<div class="empty">暂无案件，请提交</div>';
  document.querySelectorAll('.case-item').forEach(el => el.onclick = () => selectCase(el.dataset.id));
}

async function selectCase(id) {
  currentCase = id;
  if (unsubscribe) unsubscribe();
  unsubscribe = subscribeEvents(id);
  await Promise.all([loadCases(), loadDetail()]);
}

function subscribeEvents(caseId) {
  const es = new EventSource(`/api/cases/${caseId}/events`);
  const handler = () => setTimeout(loadDetail, 300);
  es.addEventListener('agent_status', handler);
  es.addEventListener('status', handler);
  es.addEventListener('approval_request', handler);
  es.addEventListener('done', handler);
  es.addEventListener('error', handler);
  return () => es.close();
}

async function loadDetail() {
  if (!currentCase) return;
  const c = await api('GET', `/api/cases/${currentCase}`);
  const d = c.json;
  if (!d.id) return;
  $('#placeholder').classList.add('hidden');
  $('#detail').classList.remove('hidden');
  const statusCls = ['planning','parsing','verifying','rule_checking','risk_assessing','reporting'].includes(d.status) ? 'b-running' : `b-${d.status}`;
  $('#caseKv').innerHTML = `
    <span class="k">案件号</span><span><b>${d.caseNo}</b>　<span class="badge ${statusCls}">${STATUS_LABEL[d.status] || d.status}${d.running ? '…' : ''}</span></span>
    <span class="k">申请人</span><span>${d.claimantName}（${d.claimantPhone}）</span>
    <span class="k">类型/运单</span><span>${d.caseType} · ${d.waybillNo}</span>
    <span class="k">申报金额</span><span>${d.declaredAmount} 元</span>
    <span class="k">事由</span><span>${d.incidentDesc || '-'}</span>
    <span class="k">材料</span><span>${(d.documents||[]).map(x => x.docType).join('、') || '-'}</span>`;

  // 审批
  const ac = $('#approvalCard');
  if (d.pendingApproval && d.status === 'waiting_approval') {
    ac.classList.remove('hidden');
    const p = d.pendingApproval.payload;
    $('#approvalKv').innerHTML = `
      <span class="k">风险分级</span><span class="risk-${p.risk.level}">${p.risk.level.toUpperCase()}（${p.risk.score} 分）${p.risk.forcedByRule ? ` · 规则强制 ${p.risk.forcedByRule}` : ''}</span>
      <span class="k">建议</span><span>${p.suggestedAction}</span>
      <span class="k">风险因子</span><span>${(p.risk.factors||[]).join('；')}</span>
      <span class="k">冲突</span><span>${(p.conflicts||[]).map(x => x.detail).join('；') || '无'}</span>`;
  } else ac.classList.add('hidden');

  // 轨迹
  const trace = (await api('GET', `/api/cases/${d.id}/trace`)).json;
  $('#traceLog').innerHTML = trace.map(t => {
    const cls = t.status === 'ok' ? 'ok' : 'err';
    const tok = (t.prompt_tokens + t.completion_tokens) ? ` · tokens ${t.prompt_tokens + t.completion_tokens}` : '';
    return `<div><span class="${cls}">[${AGENT_LABEL[t.agent] || t.agent}]</span> ${t.action} · ${t.duration_ms}ms${tok}${t.error ? ` · <span class="err">${t.error}</span>` : ''}</div>`;
  }).join('') || '<div class="info">等待执行...</div>';

  // 报告
  const rc = $('#reportCard');
  if (d.report) {
    rc.classList.remove('hidden');
    $('#reportKv').innerHTML = `
      <span class="k">结论</span><span><b>${d.report.conclusion}</b>　建议赔付：<b>${d.report.suggestedPayout ?? '—'} 元</b></span>
      <span class="k">意见</span><span>${d.report.opinion}</span>`;
    $('#reportBasis').innerHTML = (d.report.basis||[]).map(b => `· ${b.point}　<span style="color:var(--dim)">[${(b.refs||[]).map(r => `${r.source}:${r.ref}`).join(' ; ')}]</span>`).join('<br>');
  } else rc.classList.add('hidden');

  // 规则命中（从报告 markdown 前不可得；trace 里补一层）——用报告依据兜底即可
  $('#ruleHits').innerHTML = '';

  // 决策
  const dc = $('#decisionCard');
  if (d.status === 'completed') {
    dc.classList.remove('hidden');
    $('#decisionInfo').textContent = d.decision ? `已决策：${d.decision.action === 'pay' ? '赔付 ' + d.decision.amount + ' 元' : '拒赔'}（${d.decision.operator}）` : '';
  } else dc.classList.add('hidden');
}

$('#submitBtn').onclick = async () => {
  $('#submitBtn').disabled = true;
  try {
    const { json } = await api('POST', '/api/cases', { templateKey: $('#tpl').value });
    if (json.caseId) { await loadCases(); selectCase(json.caseId); }
    else alert('提交失败: ' + JSON.stringify(json));
  } finally { $('#submitBtn').disabled = false; }
};
const decide = async (decision) => {
  const { status, json } = await api('POST', `/api/cases/${currentCase}/decision`, { action: decision, operator: $('#approver').value || 'reviewer' }, { 'X-Approver-Token': $('#decToken').value });
  if (status !== 200) alert(`决策失败 ${status}: ${json.message || json.error}`);
  loadDetail();
};
$('#payBtn').onclick = () => decide('pay');
$('#rejectPayBtn').onclick = () => decide('reject');
const review = async (d) => {
  for (const b of [$('#approveBtn'), $('#rejectBtn')]) b.disabled = true;
  try {
    const { status, json } = await api('POST', `/api/cases/${currentCase}/approve`, { decision: d, approver: $('#approver').value, comment: $('#comment').value });
    if (status !== 202) alert(`审批失败 ${status}: ${json.message || json.error}`);
    $('#comment').value = '';
    loadDetail();
  } finally { for (const b of [$('#approveBtn'), $('#rejectBtn')]) b.disabled = false; }
};
$('#approveBtn').onclick = () => review('approve');
$('#rejectBtn').onclick = () => review('reject');

loadTemplates().then(loadCases);
setInterval(loadCases, 5000);
</script>
</body>
</html>
