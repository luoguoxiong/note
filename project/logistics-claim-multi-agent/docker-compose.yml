services:
  postgres:
    image: postgres:16-alpine
    container_name: claim-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claim_audit
    ports:
      - '127.0.0.1:5434:5432' # 避开本机 5432(langfuse)/5433(rag) 冲突
    volumes:
      - claim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d claim_audit']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: claim-redis
    ports:
      - '127.0.0.1:6391:6379' # 避开 6379/6380/6390 冲突
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  claim-pgdata:
